model: meta-llama/Llama-2-7b-hf
dataset: fxmeng/pissa-dataset
dataset_data_dir: metamath
train_split: train
task_name: metamath
prompt_field: instruction
response_field: output
validation_ratio: 0.05
output_root: outputs
seed: 42
epochs: 1
learning_rate: 0.0002
batch_size: 4
eval_batch_size: 4
gradient_accumulation_steps: 4
warmup_ratio: 0.03
max_seq_length: 512
max_samples: 100000
precision: bfloat16
gradient_checkpointing: true
rank: 128
alpha: 128
dropout: 0.0
switch_ratio: 0.5
target_modules: q_proj,k_proj,v_proj,o_proj
