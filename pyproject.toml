[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "s2p-lora"
version = "0.1.0"
description = "Sequential-to-Parallel Low-Rank Adaptation via function-preserving projection"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["lora", "peft", "parameter-efficient fine-tuning", "transformers"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
  "torch>=2.2",
  "transformers>=4.57,<5",
]

[project.optional-dependencies]
train = [
  "accelerate>=0.34",
  "datasets>=2.20",
  "evaluate>=0.4.2",
  "protobuf>=4.25",
  "scikit-learn>=1.3",
  "sentencepiece>=0.2",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
